# std's transcendental float functions call each platform's C library (glibc, the MSVC CRT,
# Apple's libm; compiler-builtins' musl port on wasm32), which differ in the last bit, and the
# solver amplifies that within a few steps: native and browser builds drift apart (#576,
# moenarch-games/shooter#120). The library uses the `libm` crate's, the same code everywhere;
# `tests/cross_target_hash.rs` and `scripts/cross-target-wasm.sh` check the result. `sqrt` is
# IEEE correctly rounded on every target and stays. The lint is on for `src/` only (`src/lib.rs`).
disallowed-methods = [
  { path = "f32::sin", reason = "platform libm: use libm::sinf (#576)" },
  { path = "f32::cos", reason = "platform libm: use libm::cosf (#576)" },
  { path = "f32::tan", reason = "platform libm: use libm::tanf (#576)" },
  { path = "f32::sin_cos", reason = "platform libm: use libm::sincosf (#576)" },
  { path = "f32::asin", reason = "platform libm: use libm::asinf (#576)" },
  { path = "f32::acos", reason = "platform libm: use libm::acosf (#576)" },
  { path = "f32::atan", reason = "platform libm: use libm::atanf (#576)" },
  { path = "f32::atan2", reason = "platform libm: use libm::atan2f (#576)" },
  { path = "f32::sinh", reason = "platform libm: use libm::sinhf (#576)" },
  { path = "f32::cosh", reason = "platform libm: use libm::coshf (#576)" },
  { path = "f32::tanh", reason = "platform libm: use libm::tanhf (#576)" },
  { path = "f32::exp", reason = "platform libm: use libm::expf (#576)" },
  { path = "f32::exp2", reason = "platform libm: use libm::exp2f (#576)" },
  { path = "f32::exp_m1", reason = "platform libm: use libm::expm1f (#576)" },
  { path = "f32::ln", reason = "platform libm: use libm::logf (#576)" },
  { path = "f32::ln_1p", reason = "platform libm: use libm::log1pf (#576)" },
  { path = "f32::log", reason = "platform libm: use libm::logf ratios (#576)" },
  { path = "f32::log2", reason = "platform libm: use libm::log2f (#576)" },
  { path = "f32::log10", reason = "platform libm: use libm::log10f (#576)" },
  { path = "f32::powf", reason = "platform libm: use libm::powf (#576)" },
  { path = "f32::powi", reason = "unspecified precision across targets: multiply explicitly (#576)" },
  { path = "f32::hypot", reason = "platform libm: use libm::hypotf (#576)" },
  { path = "f32::cbrt", reason = "platform libm: use libm::cbrtf (#576)" },
  { path = "f64::sin", reason = "platform libm: use libm::sin (#576)" },
  { path = "f64::cos", reason = "platform libm: use libm::cos (#576)" },
  { path = "f64::tan", reason = "platform libm: use libm::tan (#576)" },
  { path = "f64::sin_cos", reason = "platform libm: use libm::sincos (#576)" },
  { path = "f64::asin", reason = "platform libm: use libm::asin (#576)" },
  { path = "f64::acos", reason = "platform libm: use libm::acos (#576)" },
  { path = "f64::atan", reason = "platform libm: use libm::atan (#576)" },
  { path = "f64::atan2", reason = "platform libm: use libm::atan2 (#576)" },
  { path = "f64::sinh", reason = "platform libm: use libm::sinh (#576)" },
  { path = "f64::cosh", reason = "platform libm: use libm::cosh (#576)" },
  { path = "f64::tanh", reason = "platform libm: use libm::tanh (#576)" },
  { path = "f64::exp", reason = "platform libm: use libm::exp (#576)" },
  { path = "f64::exp2", reason = "platform libm: use libm::exp2 (#576)" },
  { path = "f64::exp_m1", reason = "platform libm: use libm::expm1 (#576)" },
  { path = "f64::ln", reason = "platform libm: use libm::log (#576)" },
  { path = "f64::ln_1p", reason = "platform libm: use libm::log1p (#576)" },
  { path = "f64::log", reason = "platform libm: use libm::log ratios (#576)" },
  { path = "f64::log2", reason = "platform libm: use libm::log2 (#576)" },
