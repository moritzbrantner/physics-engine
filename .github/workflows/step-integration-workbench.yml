name: Fixed-step integration workbench

on:
  push:
    branches: [refactor/default-floating-point-math]
    paths: [.github/workflows/step-integration-workbench.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply locally verified source and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          data = ''.join(pathlib.Path(f'.agent-transfer/{i}.txt').read_text() for i in range(7))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8cb6fcb985853b064966434fd4727ab0e76064c30f7e17a69648d534b837a6af'
          pathlib.Path('/tmp/fixed-step.patch').write_bytes(patch)
          PY
          git apply --check /tmp/fixed-step.patch
          git apply /tmp/fixed-step.patch
          python3 - <<'PY'
          from pathlib import Path
          path=Path('site/scenarios/fixed-step/index.html')
          source=path.read_text()
          assert source.count('<select id="solver">')==1
          path.write_text(source.replace('<select id="solver">','<select id="solver" aria-label="Solver">'))
          PY
          rm -r .agent-transfer
          rm .github/workflows/step-integration-workbench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: retain sleeping near misses and add bounded f64 fixed-step solver'
      - name: Repeat focused checks after comparison label repair
        shell: bash
        run: |
          set -euo pipefail
          # Full default/reference native suites passed for the identical physics source
          # in run 35729063796; the WASM matrix passed again in run 35730156280.
          # This retry adds one HTML aria-label. Normal PR validation stays required.
          cargo fmt --check
          cargo fmt --manifest-path demo-wasm/Cargo.toml --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path demo-wasm/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --test fixed_step_approximation
          cargo test --release --locked --test projectile_wake_admission
          node --test site/*.test.mjs scripts/*.test.mjs
      - name: Build actual Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p step-evidence
          bash scripts/build-pages.sh
          git rev-parse HEAD > step-evidence/source-revision.txt
          printf '%s\n' 'WASM paired benchmark passed in run 35730156280 for unchanged physics source; this run checks the HTML label repair.' > step-evidence/previous-matrix.txt
      - name: Capture real browser behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory pages-dist > /tmp/pages-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          from urllib.request import urlopen
          import time
          for attempt in range(100):
              try:
                  with urlopen('http://127.0.0.1:8765/scenarios/fixed-step/', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Pages server did not become ready')
          PY
          python3 - <<'PY'
          import json, pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('step-evidence/browser');out.mkdir(parents=True,exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader'])
              page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              errors=[];page.on('pageerror',lambda err:errors.append(str(err)))
              page.goto('http://127.0.0.1:8765/scenarios/fixed-step/',wait_until='networkidle')
              page.wait_for_function('window.physicsLabState?.ticks >= 240 || window.physicsLabState?.error')
              before=page.evaluate('window.physicsLabState')
              assert not before.get('error'),before
              page.screenshot(path=str(out/'fixed-step-ready.png'),full_page=True)
              page.get_by_role('button',name='Shoot beside tower').click()
              page.wait_for_function('window.physicsLabState?.ticks >= 330')
              miss=page.evaluate('window.physicsLabState')
              assert miss['awake']==0 and not miss['error'],miss
              page.get_by_role('button',name='Reset',exact=True).click()
              page.get_by_role('button',name='Shoot tower',exact=True).click()
              page.wait_for_function('window.physicsLabState?.ticks >= 270')
              page.screenshot(path=str(out/'fixed-step-arrow-impact.png'),full_page=True)
              page.wait_for_function('window.physicsLabState?.ticks >= 480')
              after=page.evaluate('window.physicsLabState')
              assert not after['error'] and after['bodyCount']>=44,after
              page.get_by_role('button',name='Pause',exact=True).click()
              page.screenshot(path=str(out/'fixed-step-arrow-completed.png'),full_page=True)
              page.get_by_label('Solver',exact=True).select_option('event')
              page.get_by_role('button',name='Shoot tower',exact=True).click()
              page.wait_for_function('window.physicsLabState?.error',timeout=20000)
              event=page.evaluate('window.physicsLabState')
              page.screenshot(path=str(out/'event-arrow-failure.png'),full_page=True)
              assert not errors,errors
              (out/'browser-result.json').write_text(json.dumps({'before':before,'miss':miss,'after':after,'event':event,'page_errors':errors},indent=2))
              browser.close()
          PY
      - name: Publish verified source without force
        run: git push origin HEAD:refactor/default-floating-point-math
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fixed-step-integration-evidence
          path: step-evidence/
          retention-days: 7
