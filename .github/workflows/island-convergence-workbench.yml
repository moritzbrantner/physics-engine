name: Independent contact-island browser verification

on:
  push:
    branches: [perf/166-island-convergence]
    paths: [.github/workflows/island-convergence-workbench.yml]

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Reuse verified physics source and remove mocked browser timers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/moritzbrantner/physics-engine/actions/artifacts/10744405287/zip \
            -o /tmp/island-first.zip
          echo '987872aa4071e68719a7c40527fe81c8815498fbb71a921cc4dc6ed1aafb9329  /tmp/island-first.zip' | sha256sum --check
          unzip -q /tmp/island-first.zip -d /tmp/island-first
          cp .agent-transfer/real-browser.py /tmp/test-tower-browser.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('/tmp/island-first')
          assert (p/'source-tree.txt').read_text().strip() == 'c8797b0ccbf0add40dcf96c83dee7ddedab83549'
          for name in ['paired.json', 'long.json', 'tower-quality.json']:
              r = json.loads((p/name).read_text())
              assert r['passed'] and all(x['passed'] for x in r['records']), name
          r = json.loads((p/'convergence.json').read_text())
          assert r['complete'] and all(x['passed'] for x in r['records'])
          PY
          git rm -r --quiet -- .
          tar -xzf /tmp/island-first/source.tar.gz
          git add -A
          test "$(git write-tree)" = c8797b0ccbf0add40dcf96c83dee7ddedab83549
          cp /tmp/test-tower-browser.py scripts/test-tower-browser.py
          git add scripts/test-tower-browser.py
          test "$(git write-tree)" = 8273774677c1c8326ce218028c5e0667b912e54b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: converge independent contact islands and validate real browser controls'
          mkdir -p island-final-evidence
          git rev-parse HEAD > island-final-evidence/source-revision.txt
          git rev-parse HEAD^{tree} > island-final-evidence/source-tree.txt
          git archive --format=tar.gz HEAD > island-final-evidence/source.tar.gz
          git diff 3074f49ca2219b89cd093af6b6f8099bb387b887 HEAD > island-final-evidence/implementation.patch
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          p = Path('/tmp/island-first')
          Path('island-final-evidence/physics-evidence-reuse.json').write_text(json.dumps({
              'passed': True, 'prior_run': 35845766603, 'prior_artifact': 10744405287,
              'verified_physics_tree': 'c8797b0ccbf0add40dcf96c83dee7ddedab83549',
              'only_changed_file': 'scripts/test-tower-browser.py',
              'tower_wasm_sha256': hashlib.sha256((p/'tower.wasm').read_bytes()).hexdigest(),
              'note': 'All prior native/build/physics stages passed; initial browser mocked-clock timeout remains a failure.'
          }, indent=2))
          PY
      - name: Build identical physics and retain normal acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test-tower-browser.py
          node --test site/*.test.mjs scripts/*.test.mjs > island-final-evidence/node-tests.log
          bash scripts/build-pages.sh > island-final-evidence/pages-build.log 2>&1
          cmp pages-dist/physics_engine_demo.wasm /tmp/island-first/tower.wasm
          cp pages-dist/physics_engine_demo.wasm island-final-evidence/tower.wasm
          cp pages-dist/build-provenance.json island-final-evidence/
      - name: Repeat real-timer browser interaction without forcing clicks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 --directory pages-dist > /tmp/island-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in 1 2; do
            python3 scripts/test-tower-browser.py --url http://127.0.0.1:8765 --output "island-final-evidence/browser-$attempt" > "island-final-evidence/browser-$attempt.log" 2>&1
          done
      - name: Publish clean verified source without force
        run: git push origin HEAD:perf/166-island-convergence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: contact-island-final-evidence
          path: island-final-evidence/
          retention-days: 7
