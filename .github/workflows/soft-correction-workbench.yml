name: Soft contact correction verification

on:
  push:
    branches: [experiment/158-soft-contact-relaxation]
    paths: [.github/workflows/soft-correction-workbench.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply verified experimental source and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p correction-evidence
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          data = b''.join(pathlib.Path(f'.agent-transfer/correction-{i}.xzpart').read_bytes() for i in range(3))
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'db487b89cfd7fb0a5d65202865abf2298275d921ce9981e7c1acf461212a515e'
          pathlib.Path('/tmp/correction.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/correction.patch
          git apply --unidiff-zero /tmp/correction.patch
          rm .agent-transfer/correction-*.xzpart .github/workflows/soft-correction-workbench.yml
          rmdir .agent-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add src/approximate/correction.rs src/approximate/correction/tests.rs scripts/benchmark-correction.mjs examples/contact_correction_quality.rs docs/soft-contact-correction.md
          test "$(git write-tree)" = f0feb2296c276d42e92d8fa5b5d9cd5e3188dd47
          git commit -m 'feat: compare opt-in soft dynamic contacts and velocity relaxation'
          git rev-parse HEAD > correction-evidence/source-revision.txt
          git rev-parse HEAD^{tree} > correction-evidence/source-tree.txt
          cp /tmp/correction.patch correction-evidence/implementation.patch
          git archive --format=tar.gz HEAD > correction-evidence/source.tar.gz
      - name: Validate both numerical modes and behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --check
            cargo fmt --manifest-path demo-wasm/Cargo.toml --check
            cargo clippy --all-targets -- -D warnings
            cargo clippy --all-targets --features exact-reference -- -D warnings
            cargo clippy --manifest-path demo-wasm/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path demo-wasm/Cargo.toml --all-targets --features exact-reference -- -D warnings
            cargo test --locked
            cargo test --locked --features exact-reference
            cargo test --manifest-path demo-wasm/Cargo.toml --locked
            cargo test --manifest-path demo-wasm/Cargo.toml --locked --features exact-reference
            cargo test --manifest-path demo-wasm/Cargo.toml --locked --test pages_adapter_long_run -- --ignored
            cargo test --manifest-path demo-wasm/Cargo.toml --locked --lib character_interaction_tests::landing_at_a_crate_stack_edge_does_not_disturb_the_crates -- --ignored
            node --test site/*.test.mjs scripts/*.test.mjs
          } 2>&1 | tee correction-evidence/validation.log
      - name: Build Pages and measure correction quality and cost
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-pages.sh
          cp pages-dist/physics_engine_demo.wasm correction-evidence/candidate.wasm
          git worktree add --detach /tmp/correction-base 9911b30635c4a967f3a5bfac636e26ef9a94e49f
          (cd /tmp/correction-base && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/correction-base/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm correction-evidence/base.wasm
          TRIALS=4 TICKS=1200 node scripts/benchmark-correction.mjs correction-evidence/candidate.wasm correction-evidence/comparison.json correction-evidence/base.wasm | tee correction-evidence/comparison.log
          cargo run --release --locked --example contact_correction_quality -- correction-evidence/heldout.json
          node scripts/benchmark-fixed-step.mjs correction-evidence/candidate.wasm correction-evidence/fixed-step.json correction-evidence/base.wasm > correction-evidence/fixed-step.log
          cp scripts/benchmark-correction.mjs correction-evidence/
          rustc --version > correction-evidence/environment.txt
          node --version >> correction-evidence/environment.txt
          lscpu >> correction-evidence/environment.txt
      - name: Publish clean verified source without force
        run: git push origin HEAD:experiment/158-soft-contact-relaxation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: soft-contact-correction-evidence
          path: correction-evidence/
          retention-days: 7
