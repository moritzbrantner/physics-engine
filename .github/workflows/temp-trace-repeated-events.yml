name: Temporary repeated-event trace patch

on:
  push:
    branches:
      - reconcile/ecs-tower-current-main-v2
    paths:
      - .github/workflows/temp-trace-repeated-events.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: reconcile/ecs-tower-current-main-v2
      - name: Add bounded event trace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/repeated_rotating_events.rs')
          text = path.read_text()

          old_limit = '''        if events.len() >= usize::from(config.max_events) {
              return Err(RepeatedRotatingEventError3d::EventLimit(config.max_events));
          }
          '''
          new_limit = '''        if events.len() >= usize::from(config.max_events) {
              let pending_pairs = frontier
                  .contacts
                  .iter()
                  .map(|contact| (contact.pair.left.0, contact.pair.right.0))
                  .collect::<Vec<_>>();
              eprintln!(
                  "repeated-event trace pending {}: time={}/{} pairs={pending_pairs:?} remaining={remaining:?}",
                  events.len() + 1,
                  frontier.time.numerator,
                  frontier.time.denominator,
              );
              return Err(RepeatedRotatingEventError3d::EventLimit(config.max_events));
          }
          '''
          if old_limit not in text:
              raise SystemExit('event-limit block not found')
          text = text.replace(old_limit, new_limit, 1)

          old_push = '''        events.push(RotatingResolvedEvent3d {
              time: response_time,
              contacts: response_contacts,
              response_passes,
          });

          if remaining.timestep_is_zero() {
          '''
          new_push = '''        events.push(RotatingResolvedEvent3d {
              time: response_time,
              contacts: response_contacts,
              response_passes,
          });
          let traced = events.last().expect("just pushed repeated event");
          let traced_pairs = traced
              .contacts
              .iter()
              .map(|contact| (contact.pair.left.0, contact.pair.right.0))
              .collect::<Vec<_>>();
          eprintln!(
              "repeated-event trace {}: time={}/{} pairs={traced_pairs:?} response_passes={} remaining={remaining:?}",
              events.len(),
              traced.time.numerator,
              traced.time.denominator,
              traced.response_passes,
          );

          if remaining.timestep_is_zero() {
          '''
          if old_push not in text:
              raise SystemExit('event push block not found')
          text = text.replace(old_push, new_push, 1)
          path.write_text(text)
          PY
      - name: Commit trace instrumentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/repeated_rotating_events.rs
          git commit -m "Trace bounded repeated-event progression"
          git push origin HEAD:reconcile/ecs-tower-current-main-v2
