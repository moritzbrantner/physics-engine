name: Temporary repeated-event trace patch

on:
  push:
    branches:
      - reconcile/ecs-tower-current-main-v2
    paths:
      - .github/workflows/temp-trace-repeated-events.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: reconcile/ecs-tower-current-main-v2
      - name: Add bounded event trace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/repeated_rotating_events.rs')
          text = path.read_text()

          limit_return = '            return Err(RepeatedRotatingEventError3d::EventLimit(config.max_events));'
          if limit_return not in text:
              raise SystemExit('event-limit return not found')
          limit_trace = '\n'.join([
              '            let pending_pairs = frontier',
              '                .contacts',
              '                .iter()',
              '                .map(|contact| (contact.pair.left.0, contact.pair.right.0))',
              '                .collect::<Vec<_>>();',
              '            eprintln!(',
              '                "repeated-event trace pending {}: time={}/{} pairs={pending_pairs:?} remaining={remaining:?}",',
              '                events.len() + 1,',
              '                frontier.time.numerator,',
              '                frontier.time.denominator,',
              '            );',
              limit_return,
          ])
          text = text.replace(limit_return, limit_trace, 1)

          zero_tail = '        if remaining.timestep_is_zero() {\n            break;\n        }'
          if zero_tail not in text:
              raise SystemExit('post-event zero-tail block not found')
          event_trace = '\n'.join([
              '        let traced = events.last().expect("just pushed repeated event");',
              '        let traced_pairs = traced',
              '            .contacts',
              '            .iter()',
              '            .map(|contact| (contact.pair.left.0, contact.pair.right.0))',
              '            .collect::<Vec<_>>();',
              '        eprintln!(',
              '            "repeated-event trace {}: time={}/{} pairs={traced_pairs:?} response_passes={} remaining={remaining:?}",',
              '            events.len(),',
              '            traced.time.numerator,',
              '            traced.time.denominator,',
              '            traced.response_passes,',
              '        );',
              '',
              zero_tail,
          ])
          text = text.replace(zero_tail, event_trace, 1)
          path.write_text(text)
          PY
      - name: Commit trace instrumentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/repeated_rotating_events.rs
          git commit -m "Trace bounded repeated-event progression"
          git push origin HEAD:reconcile/ecs-tower-current-main-v2
