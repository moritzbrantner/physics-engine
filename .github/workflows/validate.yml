name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run fast tier
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          tier: fast
          install-mode: none

      - name: Clippy without optional features
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test the Pages adapter
        run: cargo test --manifest-path demo-wasm/Cargo.toml --locked

      - name: Lint the Rapier oracle
        run: |
          cargo fmt --manifest-path oracle/Cargo.toml -- --check
          cargo clippy --manifest-path oracle/Cargo.toml --all-targets --locked -- -D warnings

      - name: Rapier oracle (invariants + native perf gate)
        run: cargo run --release --locked --manifest-path oracle/Cargo.toml

      - name: Rapier oracle on WASM (timings and sizes, not gated)
        run: node scripts/oracle-wasm.mjs

  build-pages:
    name: Build or reuse validated Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: physics-engine-pages-v1
      build_command: bash scripts/build-pages.sh
      artifact_paths: pages-dist
      reuse_across_runs: true
      artifact_retention_days: 7
