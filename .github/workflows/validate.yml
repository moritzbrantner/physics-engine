name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
          enable-kvm: false

      - name: Activate Nix CLI environment
        run: |
          nix develop --command bash -c 'printf "%s\n" "$PATH" >> "$GITHUB_PATH"'

      - name: Verify Nix Rust toolchain proxies
        run: |
          for command in rustc cargo rustup; do
            executable="$(type -P "$command")"
            case "$executable" in
              /nix/store/*) ;;
              *) echo "Expected Nix $command proxy, got $executable" >&2; exit 1 ;;
            esac
          done
          rustc --version
          cargo --version
          node --version
          python3 --version

      - name: Run deterministic fast tier
        uses: moritzbrantner/coding-tooling@20afb614772346991b3e7ac60b5857ecab5472e3
        with:
          tier: fast
          install-mode: none

      - name: Test the f32 floating-physics build
        run: cargo test --locked --features f32-physics

      - name: Run long ECS tower acceptance
        run: cargo test --release --locked --test ecs_tower_regression -- --ignored --nocapture

      - name: Test Pages sandbox adapter replay
        run: cargo test --manifest-path demo-wasm/Cargo.toml --locked --test pages_adapter_long_run -- --ignored

      - name: Test character landing replay
        run: cargo test --manifest-path demo-wasm/Cargo.toml --locked --lib character_interaction_tests::landing_at_a_crate_stack_edge_does_not_disturb_the_crates -- --ignored

      - name: Test performance ratchet policy
        run: node --test scripts/performance-ratchet.test.mjs

      - name: Prepare WASM performance target
        run: rustup target add wasm32-unknown-unknown

      - name: Enforce recorded performance ratchet
        env:
          RATCHET_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: node scripts/performance-ratchet.mjs check

      - name: Preserve ratchet measurements and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: physics-ratchet-${{ github.sha }}-${{ github.run_id }}
          path: performance-evidence/ratchet/
          if-no-files-found: warn
          retention-days: 90

  build-pages:
    name: Build or reuse validated Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: physics-engine-pages-v1
      build_command: bash scripts/build-pages.sh
      artifact_paths: pages-dist
      reuse_across_runs: true
      artifact_retention_days: 7
