name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-scope:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail-closed Markdown-only PR classification
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "docs-only=false" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then exit 0; fi
          mapfile -d '' changed < <(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA")
          if (( ${#changed[@]} == 0 )); then exit 0; fi
          for file in "${changed[@]}"; do
            if [[ "$file" != *.md ]]; then exit 0; fi
          done
          echo "docs-only=true" >> "$GITHUB_OUTPUT"

  # Three parallel jobs (#419); each timing gate still runs alone on its own runner.
  tests:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Run fast tier
        uses: moritzbrantner/coding-tooling@da4091a07b79bf276c36008c36d459b827dd3dab
        with:
          tier: fast
          install-mode: none

      - name: Clippy without optional features
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test every suite on BodyStorage::Indexed
        run: cargo test --locked --features checkpoints,indexed-storage

  work-contracts:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check out coding-tooling for the work contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: 506800a8b80b41fc39de111cf9c8d9e6203326eb
          path: .coding-tooling-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Big-O work contracts (.performance/contract.json)
        run: |
          (cd .coding-tooling-src && bun install --frozen-lockfile)
          bun .coding-tooling-src/src/router.ts performance work --root .

      - name: Oracle scenarios take no stale-tree fallback scan (full-scan-bodies 0)
        run: cargo test --release --locked -p physics-oracle --features work-counters --test full_scan

  oracle:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Rapier oracle (invariants + native perf gate)
        run: cargo run --release --locked -p physics-oracle

      - name: Check out coding-tooling for the size budget
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: 506800a8b80b41fc39de111cf9c8d9e6203326eb
          path: .coding-tooling-src

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Rapier oracle on WASM (invariants + 1.10x perf gate) and size budget (.performance/size.json)
        run: |
          (cd .coding-tooling-src && bun install --frozen-lockfile)
          CODING_TOOLING="bun .coding-tooling-src/src/router.ts" bash scripts/size-budget.sh

  build-pages:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    name: Build or reuse validated Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: physics-engine-pages-v1
      build_command: bash scripts/build-pages.sh
      artifact_paths: pages-dist
      reuse_across_runs: true
      artifact_retention_days: 7

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: [docs-scope, tests, work-contracts, oracle, build-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["docs-scope", "tests", "work-contracts", "oracle", "build-pages"]'
          allow-skipped: ${{ needs.docs-scope.outputs.docs-only == 'true' && '["tests", "work-contracts", "oracle", "build-pages"]' || '[]' }}
