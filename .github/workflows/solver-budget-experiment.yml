name: Manual solver budget experiment

on:
  workflow_dispatch:
    inputs:
      counts:
        description: Ascending powers of two (dynamic boxes)
        default: '16,32,64,128,256'
        required: true
      trials:
        description: Repetitions (2 or more for capacity)
        default: '3'
        required: true
      ticks:
        description: Simulated ticks per case, at 60 Hz
        default: '300'
        required: true

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Validate harness
        run: |
          cargo test --locked --manifest-path experiments/solver-budget/Cargo.toml
          cargo clippy --locked --manifest-path experiments/solver-budget/Cargo.toml --all-targets -- -D warnings
          node --test experiments/solver-budget/*.test.mjs
      - name: Build actual engine as release WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --manifest-path experiments/solver-budget/Cargo.toml --target wasm32-unknown-unknown
      - name: Measure serial workloads; keep quality failures explicit
        env:
          COUNTS: ${{ inputs.counts }}
          TRIALS: ${{ inputs.trials }}
          TICKS: ${{ inputs.ticks }}
        run: |
          mkdir -p experiments/solver-budget/results
          git rev-parse HEAD > experiments/solver-budget/results/source-revision.txt
          rustc --version > experiments/solver-budget/results/rust-version.txt
          node experiments/solver-budget/run.mjs experiments/solver-budget/target/wasm32-unknown-unknown/release/physics_solver_budget.wasm experiments/solver-budget/results/sweep.json
      - name: Calibrate on the actual tower without changing production defaults
        run: |
          cargo test --locked --manifest-path demo-wasm/Cargo.toml --features solver-budget-experiment diagnostic_budget_rejects_invalid_limits_without_resetting_and_default_stays_fixed
          cargo build --locked --release --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --features solver-budget-experiment
          node scripts/check-diagnostic-exports.mjs demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm budget
          node experiments/solver-budget/canonical.mjs demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm experiments/solver-budget/results/canonical.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: solver-budget-curves
          path: experiments/solver-budget/results/
          retention-days: 7
