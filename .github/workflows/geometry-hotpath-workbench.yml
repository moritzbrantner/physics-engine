name: Geometry hot-path verification

on:
  push:
    branches: [work/156-geometry-hotpath]
    paths: [.github/workflows/geometry-hotpath-workbench.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply verified patch and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.agent-transfer/geometry-hotpath.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '0a444895cb851e2503431c11a1f9f3c073a2182305e7e8c057bcd5c22cafb767'
          pathlib.Path('/tmp/geometry-hotpath.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/geometry-hotpath.patch
          git apply --unidiff-zero /tmp/geometry-hotpath.patch
          rm .agent-transfer/geometry-hotpath.patch.xz .github/workflows/geometry-hotpath-workbench.yml
          rmdir .agent-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse transient box frames and inline bounded manifolds'
      - name: Validate physics and cache boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo fmt --manifest-path demo-wasm/Cargo.toml --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --lib approximate::
          cargo test --locked --test fixed_step_approximation
          node --test site/*.test.mjs scripts/*.test.mjs
      - name: Build Pages and measure paired physics workloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geometry-hotpath-evidence
          bash scripts/build-pages.sh
          cp pages-dist/physics_engine_demo.wasm geometry-hotpath-evidence/candidate.wasm
          git worktree add --detach /tmp/geometry-merged-base 36069ceb892d9e8b24a793de7e15ae35d887b842
          (cd /tmp/geometry-merged-base && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/geometry-merged-base/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm geometry-hotpath-evidence/base.wasm
          TRIALS=6 node scripts/benchmark-prepared-response.mjs geometry-hotpath-evidence/base.wasm geometry-hotpath-evidence/candidate.wasm geometry-hotpath-evidence/paired-main.json --geometry-inline
          git worktree add --detach /tmp/geometry-pr-base 1cf9022277ced3b302b98414359fa602b5f240d4
          (cd /tmp/geometry-pr-base && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/geometry-pr-base/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm geometry-hotpath-evidence/prior-pr.wasm
          TRIALS=2 node scripts/benchmark-prepared-response.mjs geometry-hotpath-evidence/prior-pr.wasm geometry-hotpath-evidence/candidate.wasm geometry-hotpath-evidence/paired-prior-pr.json --geometry-inline
          node scripts/benchmark-fixed-step.mjs geometry-hotpath-evidence/candidate.wasm geometry-hotpath-evidence/fixed-step.json geometry-hotpath-evidence/base.wasm
          cp /tmp/geometry-hotpath.patch geometry-hotpath-evidence/implementation.patch
          cp scripts/benchmark-prepared-response.mjs geometry-hotpath-evidence/
          git rev-parse HEAD > geometry-hotpath-evidence/source-revision.txt
          git rev-parse HEAD^{tree} > geometry-hotpath-evidence/source-tree.txt
          rustc --version > geometry-hotpath-evidence/environment.txt
          node --version >> geometry-hotpath-evidence/environment.txt
          lscpu >> geometry-hotpath-evidence/environment.txt
      - name: Publish clean verified source without force
        run: git push origin HEAD:work/156-geometry-hotpath
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: geometry-hotpath-evidence
          path: geometry-hotpath-evidence/
          retention-days: 7
