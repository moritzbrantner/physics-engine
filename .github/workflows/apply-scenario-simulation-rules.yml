name: Apply scenario simulation rules slice

on:
  push:
    branches:
      - feat/scenario-simulation-rules
    paths:
      - .github/workflows/apply-scenario-simulation-rules.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4f8c0b89c0b5f28b6241c17d6515 # v6.0.1
        with:
          ref: feat/scenario-simulation-rules
          fetch-depth: 0

      - name: Apply guarded edits
        run: python3 .github/scripts/apply_scenario_rules.py

      - name: Format Rust
        run: cargo fmt --all && cargo fmt --manifest-path demo-wasm/Cargo.toml

      - name: Test engine
        run: cargo test --locked

      - name: Test Wasm adapter
        run: cargo test --manifest-path demo-wasm/Cargo.toml --locked

      - name: Validate Pages acceptance bundle
        run: bash scripts/build-pages.sh

      - name: Commit validated slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src demo-wasm tests site scripts docs
          git commit -m "Add scenario-defined simulation interaction rules"
          git push origin HEAD:feat/scenario-simulation-rules
