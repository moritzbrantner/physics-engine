name: Verify precise fixed-boundary stabilization

on:
  push:
    branches:
      - perf/changed-fixed-boundary-stabilization

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/changed-fixed-boundary-stabilization
          fetch-depth: 0
      - name: Align patch driver with current signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/changed_fixed_boundary.py')
          text = path.read_text()
          replacements = {
              'replace_function("src/stabilized_rotating_world.rs", "    pub fn add_box(\\n", add_box)':
                  'replace_function("src/stabilized_rotating_world.rs", "    pub fn add_box(&mut self, rigid_box: RigidBox3d) -> Result<(), RotatingWorldError3d> {\\n", add_box)',
              'replace_function("src/stabilized_rotating_world.rs", "    pub fn remove_box(\\n", remove_box)':
                  'replace_function("src/stabilized_rotating_world.rs", "    pub fn remove_box(&mut self, id: BodyId) -> Option<RigidBox3d> {\\n", remove_box)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'marker not found exactly once: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Apply precise fixed-boundary slice
        run: python3 .github/scripts/changed_fixed_boundary.py
      - name: Separate stabilization subjects from observable changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/stabilized_rotating_world.rs')
          text = path.read_text()
          old = '''        let mut changed_body_ids =
            self.wake_sleepers_for_sweeps(timestep_numerator, timestep_denominator)?;
        changed_body_ids.extend(self.pending_fixed_boundary_body_ids.iter().copied());
        self.freeze_sleeping_bodies()?;
'''
          new = '''        let mut changed_body_ids =
            self.wake_sleepers_for_sweeps(timestep_numerator, timestep_denominator)?;
        let mut fixed_boundary_subjects = changed_body_ids.clone();
        fixed_boundary_subjects.extend(self.pending_fixed_boundary_body_ids.iter().copied());
        self.freeze_sleeping_bodies()?;
'''
          if text.count(old) != 1:
              raise SystemExit('initial subject-set block not found exactly once')
          text = text.replace(old, new, 1)
          old = '''        changed_body_ids.extend(report.changed_body_ids.iter().copied());
        match self.stabilize_fixed_boundaries(&changed_body_ids) {
'''
          new = '''        changed_body_ids.extend(report.changed_body_ids.iter().copied());
        fixed_boundary_subjects.extend(changed_body_ids.iter().copied());
        match self.stabilize_fixed_boundaries(&fixed_boundary_subjects) {
'''
          if text.count(old) != 1:
              raise SystemExit('stabilizer subject call not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Clean generated test helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/stabilized_rotating_world.rs')
          text = path.read_text()
          old_import = '    use std::{hint::black_box, time::Instant};\n'
          new_import = '    use std::{collections::BTreeSet, hint::black_box, time::Instant};\n'
          if text.count(old_import) != 1:
              raise SystemExit('test import not found exactly once')
          text = text.replace(old_import, new_import, 1)
          old_clear = "    fn clear(&mut self) {\n        self.groups.clear();\n    }\n"
          if text.count(old_clear) != 1:
              raise SystemExit('obsolete accumulator clear method not found exactly once')
          path.write_text(text.replace(old_clear, '', 1))
          PY
      - name: Format and lint
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Performance log tests
        run: node --test site/performance-log.test.mjs
      - name: Commit verified slice
        run: |
          git rm .github/workflows/verify-changed-fixed-boundary.yml
          git rm -f .github/scripts/changed_fixed_boundary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize only changed fixed-boundary subjects"
          git push origin HEAD:perf/changed-fixed-boundary-stabilization
