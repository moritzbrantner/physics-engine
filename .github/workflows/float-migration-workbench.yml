name: Float migration workbench

on:
  push:
    branches: [refactor/default-floating-point-math]
    paths: [.github/workflows/float-migration-workbench.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Export tracked source and compiler for isolated local verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/float-workbench"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/float-workbench/source.tar.gz"
          rustup target add wasm32-unknown-unknown
          sysroot="$(rustc --print sysroot)"
          tar -czf "$RUNNER_TEMP/float-workbench/rust-toolchain.tar.gz" -C "$sysroot" bin lib
          rustc --version > "$RUNNER_TEMP/float-workbench/compiler-version.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: float-migration-workbench
          path: ${{ runner.temp }}/float-workbench
          retention-days: 1
          compression-level: 0
