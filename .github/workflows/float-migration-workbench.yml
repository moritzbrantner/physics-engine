name: Float migration workbench

on:
  push:
    branches: [refactor/default-floating-point-math]
    paths: [.github/workflows/float-migration-workbench.yml]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply locally tested patch and remove temporary workbench files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/default-floating-point-math
          git diff --exit-code 34e9a9023796f452485717d97712c56f410ad7ac -- . ':!.github/workflows/float-migration-workbench.yml' ':!.github/numeric-patch'
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/numeric-patch/part-{i}.b64').read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '27ddb5d070ed12ecf4f0a581a0e71e1268fa04040c52b999f4bed25727dbba09'
          Path(os.environ['RUNNER_TEMP'], 'numeric-migration.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/numeric-migration.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/numeric-migration.patch"
          git rm .github/workflows/float-migration-workbench.yml .github/numeric-patch/part-{0,1,2,3}.b64
          git diff --check
          cargo fmt --check
          cargo fmt --manifest-path demo-wasm/Cargo.toml --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: default scaled simulation arithmetic to float64'
          mkdir -p "$RUNNER_TEMP/numeric-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/numeric-evidence/source-sha.txt"
      - name: Validate production and diagnostic numerical paths
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --lib
          cargo test --locked --features exact-reference --lib
          cargo test --manifest-path demo-wasm/Cargo.toml --locked --lib
      - name: Build the actual Pages artifact
        run: bash scripts/build-pages.sh
      - name: Capture the real float64 tower and remaining arrow failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/numeric-browser"
          npm install --prefix "$RUNNER_TEMP/numeric-browser" --no-audit --no-fund --ignore-scripts playwright@1.55.0
          python3 -m http.server 8765 --directory pages-dist > "$RUNNER_TEMP/numeric-evidence/http.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          cp pages-dist/build-provenance.json "$RUNNER_TEMP/numeric-evidence/build-provenance.json"
          cp pages-dist/physics_engine_demo.wasm "$RUNNER_TEMP/numeric-evidence/physics_engine_demo.wasm"
          cat > "$RUNNER_TEMP/numeric-browser/capture.cjs" <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const out = path.join(process.env.RUNNER_TEMP, 'numeric-evidence');
            const browser = await chromium.launch({channel: 'chrome', headless: true, args: ['--no-sandbox', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']});
            const page = await browser.newPage({viewport: {width: 1440, height: 1000}});
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            try {
              await page.goto('http://127.0.0.1:8765/scenarios/tower/?character=physical&crates=free', {waitUntil: 'networkidle'});
              await page.waitForFunction(() => document.querySelector('#debug')?.textContent.includes('asleep'), {timeout: 45000});
              await page.locator('#close-settings').click();
              await page.locator('#scene').focus();
              await page.keyboard.press('2');
              await page.screenshot({path: path.join(out, 'tower-float64-before-arrow.png'), fullPage: true});
              await page.keyboard.press('f');
              await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('Physics stopped'), {timeout: 45000});
              await page.screenshot({path: path.join(out, 'tower-float64-arrow-failure.png'), fullPage: true});
              fs.writeFileSync(path.join(out, 'browser-result.json'), JSON.stringify({status: await page.locator('#status').innerText(), debug: await page.locator('#debug').innerText(), pageErrors: errors, limitation: 'Known free-rotation contact-convergence failure, not repaired by changing number representation.'}, null, 2));
            } catch (error) {
              await page.screenshot({path: path.join(out, 'browser-diagnostic.png'), fullPage: true});
              fs.writeFileSync(path.join(out, 'browser-diagnostic.json'), JSON.stringify({error: String(error), status: await page.locator('#status').innerText(), debug: await page.locator('#debug').innerText(), pageErrors: errors}, null, 2));
              throw error;
            } finally { await browser.close(); }
          })().catch(e => {console.error(e); process.exitCode = 1;});
          JS
          node "$RUNNER_TEMP/numeric-browser/capture.cjs"
      - name: Publish verified source to the working branch without force
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git push origin HEAD:refs/heads/refactor/default-floating-point-math
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: float64-migration-evidence
          path: ${{ runner.temp }}/numeric-evidence
          retention-days: 7
