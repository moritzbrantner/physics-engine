name: Pages

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-engine-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pages:
    name: Reuse validated Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: physics-engine-pages-v1
      build_command: bash scripts/build-pages.sh
      artifact_paths: pages-dist
      reuse_across_runs: true
      artifact_retention_days: 7

  deploy-pages:
    needs: build-pages
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: ""
      artifact_path: pages-dist
      prebuilt_artifact_run_id: ${{ needs.build-pages.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-pages.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-pages.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-pages.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-pages.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-pages.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
      concurrency_group: physics-engine-pages
      cancel_in_progress: false
