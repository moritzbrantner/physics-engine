name: Verify changed-body writeback slice

on:
  push:
    branches:
      - perf/necessary-work-stabilization-core

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/necessary-work-stabilization-core
          fetch-depth: 0
      - name: Align patch driver with current signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/changed_body_writeback.py')
          text = path.read_text()
          old = '    "    fn stabilize_fixed_boundaries(\\n",\n'
          new = '    "    fn stabilize_fixed_boundaries(&mut self) -> Result<(), RotatingWorldError3d> {\\n",\n'
          if text.count(old) != 1:
              raise SystemExit('stabilizer marker not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Implement changed-body step deltas
        run: python3 .github/scripts/changed_body_writeback.py
      - name: Remove obsolete quiescence scan hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/relaxed_rotating_world.rs')
          text = path.read_text()
          old = (
              "    #[must_use]\n"
              "    pub(crate) fn is_quiescent(&self) -> bool {\n"
              "        self.active_dynamic_count == 0\n"
              "    }\n\n"
          )
          if text.count(old) != 1:
              raise SystemExit('is_quiescent method not found exactly once')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Format and lint
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Performance log tests
        run: node --test site/performance-log.test.mjs
      - name: Commit verified slice
        run: |
          git rm .github/workflows/continue-necessary-work-writeback.yml
          git rm .github/scripts/changed_body_writeback.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Propagate precise changed-body step deltas"
          git push origin HEAD:perf/necessary-work-stabilization-core
