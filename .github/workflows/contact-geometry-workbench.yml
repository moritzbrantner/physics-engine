name: Contact geometry reuse verification

on:
  push:
    branches: [perf/156-contact-geometry-reuse]
    paths: [.github/workflows/contact-geometry-workbench.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply locally verified source and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.agent-transfer/contact-geometry.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '5236564914114ff75f1b2f61ae1bf7e652463f0581031e6b0fd68403a0a866c8'
          pathlib.Path('/tmp/contact-geometry.patch').write_bytes(patch)
          PY
          git apply --check /tmp/contact-geometry.patch
          git apply /tmp/contact-geometry.patch
          rm .agent-transfer/contact-geometry.patch.xz .github/workflows/contact-geometry-workbench.yml
          rmdir .agent-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse dependency-validated contact geometry with replay evidence'
      - name: Validate conservative cache behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo fmt --manifest-path demo-wasm/Cargo.toml --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --lib approximate::
          cargo test --locked --test fixed_step_approximation
          node --test site/*.test.mjs scripts/*.test.mjs
      - name: Build actual Pages artifact and paired geometry evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geometry-evidence
          bash scripts/build-pages.sh
          cp pages-dist/physics_engine_demo.wasm geometry-evidence/candidate.wasm
          git worktree add --detach /tmp/geometry-base 36069ceb892d9e8b24a793de7e15ae35d887b842
          (cd /tmp/geometry-base && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/geometry-base/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm geometry-evidence/base.wasm
          node scripts/benchmark-prepared-response.mjs geometry-evidence/base.wasm geometry-evidence/candidate.wasm geometry-evidence/paired.json --geometry
          node scripts/benchmark-fixed-step.mjs geometry-evidence/candidate.wasm geometry-evidence/fixed-step.json geometry-evidence/base.wasm
          cp /tmp/contact-geometry.patch geometry-evidence/implementation.patch
          cp scripts/benchmark-prepared-response.mjs geometry-evidence/
          git rev-parse HEAD > geometry-evidence/source-revision.txt
          git rev-parse HEAD^{tree} > geometry-evidence/source-tree.txt
          rustc --version > geometry-evidence/environment.txt
          node --version >> geometry-evidence/environment.txt
          lscpu >> geometry-evidence/environment.txt
      - name: Publish verified source without force
        run: git push origin HEAD:perf/156-contact-geometry-reuse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: contact-geometry-reuse-evidence
          path: geometry-evidence/
          retention-days: 7
