name: Repair necessary-work contact cache

on:
  push:
    branches:
      - perf/necessary-work-stabilization-core

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/necessary-work-stabilization-core
          fetch-depth: 0
      - name: Apply semantic repair
        run: python3 scripts/repair-necessary-work-contact-cache.py
      - name: Format and lint
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Performance log tests
        run: node --test site/performance-log.test.mjs
      - name: Commit verified semantic repair
        run: |
          git rm scripts/repair-necessary-work-contact-cache.py .github/workflows/repair-necessary-work-contact-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse unchanged contact evidence during stabilization"
          git push origin HEAD:perf/necessary-work-stabilization-core
