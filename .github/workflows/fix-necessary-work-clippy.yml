name: Fix necessary-work fast-tier lint

on:
  push:
    branches:
      - perf/necessary-work-stabilization-core

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/necessary-work-stabilization-core
          fetch-depth: 0
      - name: Fix precise-query call style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/repeated_rotating_events.rs")
          text = path.read_text()
          old = "broad_phase.candidate_pairs_for_changed_current_bodies(active_boxes.into_iter())?;"
          new = "broad_phase.candidate_pairs_for_changed_current_bodies(active_boxes)?;"
          if text.count(old) != 1:
              raise SystemExit("expected precise-query call not found exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Performance log tests
        run: node --test site/performance-log.test.mjs
      - name: Commit verified lint fix
        run: |
          git rm .github/workflows/fix-necessary-work-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix precise stabilization query lint"
          git push origin HEAD:perf/necessary-work-stabilization-core
