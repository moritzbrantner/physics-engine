name: Issue 155 bookkeeping verification

on:
  push:
    branches: [perf/155-fixed-step-bookkeeping]
    paths: [.github/workflows/bookkeeping-workbench.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply candidate and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.agent-transfer/issue155.patch.xz.b64').read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '652bfd5d926baa0fed4400b51f06b11eb586842b7bdddfa3cc216a671bd5b117'
          pathlib.Path('/tmp/bookkeeping.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bookkeeping.patch
          git apply /tmp/bookkeeping.patch
          rm .agent-transfer/issue155.patch.xz.b64 .github/workflows/bookkeeping-workbench.yml
          rmdir .agent-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: retain fixed-step membership, contact adjacency and scratch buffers'
      - name: Verify focused behavior
        run: |
          cargo fmt --check
          cargo fmt --manifest-path demo-wasm/Cargo.toml --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --lib approximate::
          cargo test --locked --test fixed_step_approximation
      - name: Build and compare real WASM replays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bookkeeping-evidence
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
          cp demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm bookkeeping-evidence/candidate.wasm
          git worktree add --detach /tmp/bookkeeping-base 23c2ac9655f9f6ef452cea9ae7dd4cc34ee89ee7
          (cd /tmp/bookkeeping-base && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/bookkeeping-base/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm bookkeeping-evidence/base.wasm
          node scripts/benchmark-prepared-response.mjs bookkeeping-evidence/base.wasm bookkeeping-evidence/candidate.wasm bookkeeping-evidence/paired.json --bookkeeping
          node scripts/benchmark-fixed-step.mjs bookkeeping-evidence/candidate.wasm bookkeeping-evidence/fixed-step.json bookkeeping-evidence/base.wasm
          cp scripts/benchmark-prepared-response.mjs bookkeeping-evidence/
          git rev-parse HEAD > bookkeeping-evidence/source-revision.txt
          git rev-parse HEAD^{tree} > bookkeeping-evidence/source-tree.txt
          cp /tmp/bookkeeping.patch bookkeeping-evidence/implementation.patch
      - name: Publish verified implementation
        run: git push origin HEAD:perf/155-fixed-step-bookkeeping
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fixed-step-bookkeeping-evidence
          path: bookkeeping-evidence/
          retention-days: 7
