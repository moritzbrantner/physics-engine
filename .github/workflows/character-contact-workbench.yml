name: Character Contact Workbench
on:
  push:
    branches: [work/character-contact-experiment]
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 7a483388445e7f726bb8e64d0cf17143866d703b
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Prepare baseline and source change
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/work/character-contact-experiment
          mkdir -p .workbench-evidence
          git rev-parse HEAD > .workbench-evidence/source-sha.txt
          rustc -Vv > .workbench-evidence/environment.txt
          node --version >> .workbench-evidence/environment.txt
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
          cp demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm .workbench-evidence/base.wasm
          python3 scripts/prepare-character-contact.py
          cargo fmt
          cargo fmt --manifest-path demo-wasm/Cargo.toml
      - name: Validate engine and real sandbox interactions
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee .workbench-evidence/clippy.log
          cargo test --locked 2>&1 | tee .workbench-evidence/engine-tests.log
          cargo clippy --manifest-path demo-wasm/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee .workbench-evidence/demo-clippy.log
          cargo test --manifest-path demo-wasm/Cargo.toml --locked 2>&1 | tee .workbench-evidence/demo-tests.log
          cargo test --manifest-path demo-wasm/Cargo.toml --locked --lib character_interaction_tests::landing_at_a_crate_stack_edge_does_not_disturb_the_crates -- --ignored --nocapture 2>&1 | tee .workbench-evidence/landing-replay.log
          cargo test --manifest-path demo-wasm/Cargo.toml --locked --test pages_adapter_long_run -- --ignored 2>&1 | tee .workbench-evidence/pages-replay.log
          bash scripts/build-pages.sh
          cp demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm .workbench-evidence/head.wasm
          BASELINE_WASM=.workbench-evidence/base.wasm node scripts/benchmark-sandbox.mjs .workbench-evidence/head.wasm .workbench-evidence/physical-parity.json
      - name: Publish only validated implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git add src demo-wasm/src tests site docs .github/workflows/validate.yml
          git add -u scripts/prepare-character-contact.py .github/workflows/character-contact-workbench.yml
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Add optional linear character pushes and passive crate support' | git -c user.name='coding-agent' -c user.email='coding-agent@users.noreply.github.com' commit-tree "$tree" -p "$BASE_SHA")"
          git push origin "$commit:refs/heads/feat/character-linear-push"
          echo "$commit" > .workbench-evidence/implementation-sha.txt
      - name: Preserve source and execution evidence
        if: always()
        shell: bash
        run: |
          git diff > .workbench-evidence/working.patch
          tar czf .workbench-evidence/source.tar.gz --exclude=target --exclude=.git --exclude=pages-dist --exclude=.workbench-evidence src demo-wasm tests site docs scripts Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml .github .coding-tooling.json AGENTS.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: character-contact-workbench-${{ github.sha }}
          path: .workbench-evidence/
          retention-days: 7
