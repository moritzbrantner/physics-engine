name: Fix necessary-work indexing

on:
  push:
    branches:
      - perf/necessary-work-stabilization-core

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/necessary-work-stabilization-core
          fetch-depth: 0
      - name: Apply stable-index reuse
        run: python3 scripts/fix-necessary-work-indexing.py
      - name: Format and lint
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Performance log tests
        run: node --test site/performance-log.test.mjs
      - name: Commit verified index reuse
        run: |
          git rm scripts/fix-necessary-work-indexing.py .github/workflows/fix-necessary-work-indexing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse stable body index in stabilization"
          git push origin HEAD:perf/necessary-work-stabilization-core
