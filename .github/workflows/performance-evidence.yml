name: Performance Evidence

on:
  pull_request:
    paths:
      - "src/query.rs"
      - "src/ballistic_sphere.rs"
      - "src/rigid_box.rs"
      - "src/linear_contact.rs"
      - "src/stabilized_rotating_world.rs"
      - "src/relaxed_rotating_world.rs"
      - "src/obb_friction.rs"
      - "src/rigid_box_free_flight.rs"
      - "src/repeated_rotating_events.rs"
      - "src/rotating_broad_phase.rs"
      - "src/rotating_broad_phase_tree.rs"
      - "src/rotating_contact_frontier.rs"
      - "src/rotating_contact_search.rs"
      - "src/rotating_contact_search_ordered.rs"
      - "src/rotating_recontact_search.rs"
      - "src/rotating_recontact_prepared_tests.rs"
      - "src/oriented_box.rs"
      - "src/obb_response.rs"
      - "src/rotating_contact_response.rs"
      - "src/current_contact_query.rs"
      - "src/fixed_geometry.rs"
      - "src/rotating_world.rs"
      - "src/support_query.rs"
      - "tests/*performance*.rs"
      - "tests/current_contact_broadphase.rs"
      - "tests/fixed_wall_sweep_bounds.rs"
      - "tests/linear_contact_policy.rs"
      - "demo-wasm/**"
      - ".performance/contract.json"
      - ".performance/sandbox-evidence-profile.json"
      - ".coding-tooling.json"
      - "scripts/run-performance-evidence.sh"
      - "scripts/run-sandbox-performance.sh"
      - "scripts/benchmark-sandbox.mjs"
      - "scripts/validate-performance-contract.mjs"
      - "scripts/benchmark-character-options.mjs"
      - "scripts/benchmark-projectile-policies.mjs"
      - "scripts/benchmark-baking.mjs"
      - "scripts/collect-performance-log.sh"
      - "scripts/adapt-performance-evidence.mjs"
      - "scripts/adapt-performance-evidence.test.mjs"
      - "scripts/validate-performance-evidence.py"
      - "scripts/package-performance-log.mjs"
      - "scripts/package-performance-log.test.mjs"
      - "scripts/summarize-cpu-profile.mjs"
      - "site/performance-log.mjs"
      - "site/performance-log.test.mjs"
      - "site/app.js"
      - "site/index.html"
      - "scripts/build-pages.sh"
      - ".github/workflows/performance-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare Rust toolchain
        run: rustc --version && cargo --version

      - name: Resolve changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/performance-evidence-files.txt
          else
            git show --pretty='' --name-only HEAD > /tmp/performance-evidence-files.txt
          fi
          cat /tmp/performance-evidence-files.txt

      - name: Run release performance evidence
        run: bash scripts/run-performance-evidence.sh /tmp/performance-evidence-files.txt

      - name: Compare sandbox WASM workload with the base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/run-sandbox-performance.sh

      - name: Record independent character gameplay options
        run: |
          cp scripts/benchmark-character-options.mjs performance-evidence/
          node scripts/benchmark-character-options.mjs performance-evidence/head.wasm performance-evidence/character-options.json

      - name: Record dense projectile policy matrix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp scripts/benchmark-projectile-policies.mjs performance-evidence/
          node scripts/benchmark-projectile-policies.mjs performance-evidence/head.wasm performance-evidence/projectile-policies.json

      - name: Compare optional fixed geometry preparation
        run: |
          cp scripts/benchmark-baking.mjs performance-evidence/
          node scripts/benchmark-baking.mjs performance-evidence/head.wasm performance-evidence/baking-options.json

      - name: Package portable performance evidence
        if: ${{ always() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_DIRTY: "false"
        run: |
          node scripts/package-performance-log.mjs \
            performance-evidence \
            "physics-performance-evidence-${HEAD_SHA}-${GITHUB_RUN_ID}.tar.gz"

      - name: Check out canonical Performance Evidence contract
        if: ${{ success() }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/performance-evidence
          ref: 294c136eccb78c0614a42f844b02ea306f0c8f2b
          path: .performance-evidence-contract

      - name: Install Performance Evidence validator
        if: ${{ success() }}
        run: python -m pip install -r .performance-evidence-contract/requirements-dev.txt

      - name: Validate canonical Performance Evidence
        if: ${{ success() }}
        run: >-
          python scripts/validate-performance-evidence.py
          .performance-evidence-contract
          performance-evidence

      - name: Upload reproducible performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: physics-performance-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            performance-evidence/
            physics-performance-evidence-*.tar.gz
          if-no-files-found: warn
          retention-days: 14
