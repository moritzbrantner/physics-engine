name: Correction gate verification

on:
  push:
    branches: [work/158-correction-slop-gate]
    paths: [.github/workflows/correction-gate-workbench.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply tested correction gate and remove transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p correction-gate-evidence
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.agent-transfer/relaxation-gate.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'c04e0c7643cefea20b9818728a820587e25ce64a26b8066a1e21a5bc78a1d24c'
          pathlib.Path('/tmp/correction-gate.patch').write_bytes(patch)
          PY
          git apply --check /tmp/correction-gate.patch
          git apply /tmp/correction-gate.patch
          rm .agent-transfer/relaxation-gate.patch.xz .github/workflows/correction-gate-workbench.yml
          rmdir .agent-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          test "$(git write-tree)" = 0c61928e207e3bba03eacc57e13b6306e72c0018
          git commit -m 'perf: avoid soft correction within slop and reuse certified relaxation solves'
          git rev-parse HEAD > correction-gate-evidence/source-revision.txt
          git rev-parse HEAD^{tree} > correction-gate-evidence/source-tree.txt
          cp /tmp/correction-gate.patch correction-gate-evidence/implementation.patch
          git archive --format=tar.gz HEAD > correction-gate-evidence/source.tar.gz
      - name: Verify correction and physics boundaries
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --check
            cargo fmt --manifest-path demo-wasm/Cargo.toml --check
            cargo clippy --all-targets -- -D warnings
            cargo test --locked --lib approximate::
            cargo test --locked --features exact-reference --lib approximate::
            cargo test --locked --test fixed_step_approximation
            cargo test --manifest-path demo-wasm/Cargo.toml --locked --lib approximate::
            node --test site/*.test.mjs scripts/*.test.mjs
          } 2>&1 | tee correction-gate-evidence/validation.log
      - name: Build Pages and compare five policies over equal simulated time
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-pages.sh
          cp pages-dist/physics_engine_demo.wasm correction-gate-evidence/candidate.wasm
          git worktree add --detach /tmp/correction-main 9911b30635c4a967f3a5bfac636e26ef9a94e49f
          (cd /tmp/correction-main && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/correction-main/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm correction-gate-evidence/base.wasm
          git worktree add --detach /tmp/correction-previous 826531f7dd43168bbe6e2bec0d52bca7572b0486
          (cd /tmp/correction-previous && cargo build --manifest-path demo-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked)
          cp /tmp/correction-previous/demo-wasm/target/wasm32-unknown-unknown/release/physics_engine_demo.wasm correction-gate-evidence/previous.wasm
          TRIALS=5 TICKS=1200 node scripts/benchmark-correction.mjs correction-gate-evidence/candidate.wasm correction-gate-evidence/comparison.json correction-gate-evidence/base.wasm correction-gate-evidence/previous.wasm | tee correction-gate-evidence/comparison.log
          cargo run --release --locked --example contact_correction_quality -- correction-gate-evidence/quality.json
          node scripts/benchmark-fixed-step.mjs correction-gate-evidence/candidate.wasm correction-gate-evidence/fixed-step.json correction-gate-evidence/base.wasm > correction-gate-evidence/fixed-step.log
          cp scripts/benchmark-correction.mjs correction-gate-evidence/
          rustc --version > correction-gate-evidence/environment.txt
          node --version >> correction-gate-evidence/environment.txt
          lscpu >> correction-gate-evidence/environment.txt
      - name: Publish verified source without force
        run: git push origin HEAD:work/158-correction-slop-gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: correction-gate-evidence
          path: correction-gate-evidence/
          retention-days: 7
