<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>physics-engine · tower lab</title>
  <style>
    :root{color-scheme:light dark;--bg:#0d1a24;--panel:#142532;--text:#dbe8ef;--line:#304955}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
    main{max-width:1200px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 8px}
    .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:16px 0}
    label{display:grid;gap:6px;font-size:13px}
    select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid #4d6576;border-radius:6px;padding:8px 12px}
    button{cursor:pointer}button:disabled{opacity:.45}
    .world{border:1px solid var(--line);border-radius:8px;overflow:hidden}
    canvas{display:block;width:100%;height:520px}@media(max-width:700px){canvas{height:360px}}
    .status{margin:0;padding:10px 14px;background:var(--panel);font:13px ui-monospace,monospace}
  </style>
</head>
<body><main>
  <h1>Tower lab</h1>
  <p>A 32-crate tower on <code>approximate::World</code> (f32). Rust owns all bodies, contacts and steps; this page sends commands and renders snapshots. Side-by-side Rapier parity scenarios replace this page as they land.</p>
  <div class="controls">
    <label>Crate rotation<select id="crates"><option value="free">Free rotation</option><option value="upright">Locked upright</option></select></label>
    <label>Projectile<select id="projectile"><option value="1">Arrow</option><option value="0">Sphere</option><option value="2">Rigid box</option></select></label>
    <button id="hit" disabled>Shoot tower</button><button id="miss" disabled>Shoot beside tower</button><button id="pause" disabled>Resume</button><button id="reset" disabled>Reset</button>
  </div>
  <section class="world"><canvas id="scene" width="1280" height="520" aria-label="Tower of crates"></canvas>
    <p class="status" id="status" role="status" aria-live="polite">Loading Rust/WASM…</p></section>
  <script type="module" src="lab.js"></script>
</main></body></html>
