[package]
name = "physics-oracle"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "oracle"
description = "Rapier oracle: runs each parity scenario on Rapier and physics-engine"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["engine", "rapier"]
# Each side can be built alone so the WASM size of each engine's workload is measurable.
engine = ["dep:physics-engine"]
rapier = ["dep:rapier3d"]
# Test-only: physics-engine work counters, for tests/full_scan.rs.
work-counters = ["engine", "physics-engine/work-counters"]

[dependencies]
physics-engine = { path = "..", optional = true }
rapier3d = { version = "=0.36.1", optional = true }

[[bin]]
name = "oracle"
path = "src/main.rs"
required-features = ["engine", "rapier"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["engine", "rapier"]

[[test]]
name = "full_scan"
required-features = ["work-counters"]
