[package]
name = "physics-engine-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Budget controls are diagnostic exports, never a production quality switch.
solver-budget-experiment = []
exact-reference = ["physics-engine/exact-reference"]
experimental-soft-contact = ["physics-engine/experimental-soft-contact"]

[dependencies]
physics-engine = { path = ".." }

[dev-dependencies]
serde_json = "=1.0.151"

[[example]]
name = "checkpoint-continuation"
crate-type = ["cdylib"]
test = true

