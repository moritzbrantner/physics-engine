[package]
name = "physics-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic continuous-collision physics kernel"

[dependencies]
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "7049e423ef00f5f65e7276281c0845d431ed6300" }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"

[features]
default = ["performance-counters"]
# Diagnostic computational-work counters. Disable with --no-default-features to prove
# instrumentation-neutral simulation semantics without changing the default evidence path.
performance-counters = []
# Diagnostic legacy replay only. Never required by the default or Pages build.
exact-reference = []
# Diagnostic correction study only; no optional state/branches in production builds.
experimental-soft-contact = []

[lib]
name = "physics_engine"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "contact_correction_quality"
required-features = ["experimental-soft-contact"]
