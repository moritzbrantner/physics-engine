[package]
name = "physics-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic continuous-collision physics kernel"

[dependencies]
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "531a49178d50405e007c9b05d3bdc3bdce7d9e49" }

[features]
default = []
# Diagnostic legacy replay only. Never required by the default or Pages build.
exact-reference = []

[lib]
name = "physics_engine"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
