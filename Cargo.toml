[package]
name = "physics-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic continuous-collision physics kernel"

[dependencies]
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "b3e2bf8f84958dc84598422beb5e00ca6841b803" }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"

[features]
default = ["performance-counters"]
# Diagnostic computational-work counters. Disable with --no-default-features to prove
# instrumentation-neutral simulation semantics without changing the default evidence path.
performance-counters = []
# Diagnostic legacy replay only. Never required by the default or Pages build.
exact-reference = []
# Whole-build choice (non-additive by design): the floating solver (`approximate::World`)
# stores physical state as f32 instead of f64. Legacy worlds and time composition stay f64.
# Checkpoints from one width are rejected by the other. Incompatible with `exact-reference`.
# See docs/numerics.md for the supported f32 precision envelope.
f32-physics = []
# Diagnostic correction study only; no optional state/branches in production builds.
experimental-soft-contact = []

[lib]
name = "physics_engine"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "contact_correction_quality"
required-features = ["experimental-soft-contact"]
