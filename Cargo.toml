[package]
name = "physics-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Physics engine for the owner's games, measured against Rapier"

[dependencies]
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3f65da78e6a7abe3de9f82069b1f3a42a654e3d6" }
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "fa1e0b0385963b4e85ef5f51b7b801100cb56200" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "fa1e0b0385963b4e85ef5f51b7b801100cb56200" }
sha2 = { version = "0.11.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "=1.0.154"

[features]
default = []
# Opt-in versioned physical checkpoints for debugging and logging.
checkpoints = ["dep:sha2"]
# Test-only deterministic work counters for the complexity contracts (.performance/contract.json).
# Off in every release build, so they never affect the Rapier speed gate.
work-counters = []
# Test-only: `Config::default()` uses `BodyStorage::Indexed`, so every suite checks that both
# storage modes give identical results.
indexed-storage = []

[lib]
name = "physics_engine"
path = "src/lib.rs"

[lints.rust]
# The library forbids unsafe code itself (`#![forbid(unsafe_code)]`); only the counting
# allocator of the complexity-contract test opts in.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Fixture literals keep their recorded decimal values; f32 rounds them.
excessive_precision = "allow"

[[test]]
name = "capsule_contact_normals"
required-features = ["checkpoints"]

[[test]]
name = "dense_contact_regression"
required-features = ["checkpoints"]

[[test]]
name = "floating_ccd_remaining_time"
required-features = ["checkpoints"]

[[test]]
name = "floating_checkpoints"
required-features = ["checkpoints"]

[[test]]
name = "floating_shape_queries"
required-features = ["checkpoints"]

[[test]]
name = "floating_sweep_failures"
required-features = ["checkpoints"]

[[test]]
name = "primitive_capabilities"
required-features = ["checkpoints"]

[[test]]
name = "capsule_row_work"
required-features = ["checkpoints"]

[[test]]
name = "contact_materials"
required-features = ["checkpoints"]

[[test]]
name = "contact_wake_forces"
required-features = ["checkpoints"]

[[test]]
name = "driven_parked_contact"
required-features = ["checkpoints"]

[[test]]
name = "fixed_contact_interval"
required-features = ["checkpoints"]

[[test]]
name = "moving_support_quality"
required-features = ["checkpoints"]

[[test]]
name = "narrow_support"
required-features = ["checkpoints"]

[[test]]
name = "primitive_contact_quality"
required-features = ["checkpoints"]

[[test]]
name = "stationary_external_support"
required-features = ["checkpoints"]

[[test]]
name = "tangential_contact_wake"
required-features = ["checkpoints"]

[[test]]
name = "work_complexity"
required-features = ["work-counters"]
